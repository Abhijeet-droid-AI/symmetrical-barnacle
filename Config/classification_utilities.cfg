; =============================================================================
;  CLASSIFICATION UTILITIES - MASTER CONFIGURATION
;  =============================================================================
;  This is the DEVELOPER configuration file. It holds every library and
;  function setting. All three utilities (Extraction, Import, Delete) read
;  their paths, logs and ingestion settings from here, [ENVIRONMENT] points
;  at the Teamcenter installation (library settings), and [RUN] decides
;  which utility Run.bat executes.
;
;  NOTE: the Teamcenter LOGIN CREDENTIALS (TC_USER / TC_PASS / TC_GROUP)
;  live in a SEPARATE file:
;
;        Config\tc_config.txt           <- TC login only - the ONLY file
;                                          the user edits
;
;  The user who receives the exes edits ONLY tc_config.txt. Everything in
;  THIS file - including [ENVIRONMENT] TC_ROOT / TC_DATA - is owned and
;  maintained by the developer. Users never change this file.
;
;  Rules:
;    - Sections are in [BRACKETS], keys are KEY = VALUE
;    - ';' or '#' at start of a line = comment
;    - Paths may end with '\' or not - the code normalizes them
;    - %ITEM_ID% / %ITEM_REV% inside *_QUERY are replaced at runtime
;      by the values coming from the CSV (mode CSV_DB)
;  =============================================================================


; -----------------------------------------------------------------------------
;  BUILD - used only by Build_*.bat files (msbuild from command line)
; -----------------------------------------------------------------------------
[BUILD]
; vcvarsall.bat of your Visual Studio installation.
;   Home laptop : C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat
;   Office (VS2022 Professional assumed - adjust edition if different):
;   C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvarsall.bat
; NOTE: the projects are toolset-agnostic (no v143 pin), so they build with
; any Visual Studio version that provides this vcvarsall.bat.
VCVARSALL     = C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat
PLATFORM      = x64
CONFIGURATION = Release


; -----------------------------------------------------------------------------
;  ENVIRONMENT - Teamcenter installation (LIBRARY settings - developer-owned).
;  Used by Build_All.bat (include/lib paths for the build) and by the
;  Run_*.bat wrappers (TC_DATA selects tc_profilevars.bat for the runtime
;  environment). The user does NOT edit this section.
; -----------------------------------------------------------------------------
[ENVIRONMENT]
; Root of the Teamcenter installation (the folder that contains include\,
; include_cpp\ and lib\).  Example: D:\Teamcenter_2312\tc
TC_ROOT  = D:\Teamcenter_2312\tc

; TC data volume - the folder that contains tc_profilevars.bat.
; Example: \\gptcdv-ep-atc04\apps\TCDATA
TC_DATA  = \\gptcdv-ep-atc04\apps\TCDATA


; -----------------------------------------------------------------------------
;  NOTE: the Teamcenter login credentials ([CREDENTIALS] TC_USER/TC_PASS/
;  TC_GROUP) live in Config\tc_config.txt - the only file the user edits.
;
;  LOGS - where the Success_*.log / Fail_*.log files are written
;  (shared defaults; each utility creates its own files with time stamps)
; -----------------------------------------------------------------------------
[LOGS]
; Log directory (created automatically if missing)
LOG_DIR         = D:\ITK_customization\ClassificationUtilities\Logs\

; File name prefixes; time stamp _YYYY_MM_DD__HH_MM_SS is appended.
; Extraction and Import share LOG_PREFIX_OK / LOG_PREFIX_FAIL.
LOG_PREFIX_OK   = SuccessEPM_
LOG_PREFIX_FAIL = FailEPM_

; Delete additionally writes a rerun file (failed rows for a re-run)
LOG_PREFIX_RERUN = Rerun_Classification_

; YES = overwrite the log files at the start of a run, NO = append
RECREATE_LOG_FILES = NO


; -----------------------------------------------------------------------------
;  EXTRACTION - extracts classification (ICO) attributes into a pipe
;  delimited output file.
;
;  INPUT_MODE selects the data ingestion:
;     CSV      : read item_id|item_revision_id directly from CSV_FILE
;     DB       : run DB_QUERY, every returned row (item_id[,item_rev]) is used
;     CSV_DB   : for every item_id in CSV_FILE substitute %ITEM_ID%
;                (and %ITEM_REV% if present) into CSV_DB_QUERY, run the
;                query and use every returned row (item_id[,item_rev])
; -----------------------------------------------------------------------------
[EXTRACTION]
INPUT_MODE    = CSV

; ---- used by INPUT_MODE = CSV and CSV_DB ----
CSV_FILE      = D:\ITK_customization\ClassificationUtilities\ClassificationExtraction\InputFileT.txt
; Column separator inside the CSV file
CSV_DELIMITER = |
; 1st row is a header row (item_id|item_revision_id) and is skipped
CSV_HAS_HEADER = YES
; CSV_DB only: if a query returns no row for a CSV item, fall back to the
; CSV id itself (YES) or skip the item (NO)
CSV_DB_FALLBACK_TO_CSV = YES

; ---- used by INPUT_MODE = DB ----
; ODBC connection string (64 bit DSN configured in Windows ODBC administrator)
DB_CONN_STR   = DSN=TCDB;UID=readonly;PWD=readonly
; Query must return item_id as column 1 and optionally item_revision_id as column 2
DB_QUERY      = SELECT item_id, item_revision_id FROM pitem WHERE item_id LIKE '1111-5YY%'

; ---- used by INPUT_MODE = CSV_DB ----
; %ITEM_ID% is replaced by the value from CSV column 1,
; %ITEM_REV% (optional) by CSV column 2
CSV_DB_QUERY  = SELECT item_id, item_revision_id FROM pitem WHERE item_id = '%ITEM_ID%'

; ---- output ----
; Output file holding the extracted classification attributes
OUTPUT_FILE   = D:\ITK_customization\ClassificationUtilities\ClassificationExtraction\OutputFile.txt


; -----------------------------------------------------------------------------
;  IMPORT - classifies objects into ICS classes and sets the classification
;  attributes.
;
;  The CSV header names MUST match the Teamcenter class attribute names,
;  plus the mandatory columns:
;     item_id | item_revision_id | object_type | class_id
;  (the historic Import delimiter is '~##' - change CSV_DELIMITER only if
;   your input file really uses something else)
; -----------------------------------------------------------------------------
[IMPORT]
INPUT_MODE    = CSV

CSV_FILE      = D:\ITK_customization\ClassificationUtilities\ClassificationImport\ImportInputBlade.txt
CSV_DELIMITER = ~##
CSV_HAS_HEADER = YES
CSV_DB_FALLBACK_TO_CSV = YES

DB_CONN_STR   = DSN=TCDB;UID=readonly;PWD=readonly
DB_QUERY      = SELECT item_id, item_revision_id, object_type, class_id FROM pitem
CSV_DB_QUERY  = SELECT item_id, item_revision_id, object_type, class_id FROM pitem WHERE item_id = '%ITEM_ID%'


; -----------------------------------------------------------------------------
;  DELETE - validates classification attributes against Teamcenter and writes
;  failed rows into a rerun file. (This utility was formerly called
;  "Validation"; the old [VALIDATION] section name is no longer used.)
;
;  The CSV header names MUST match the Teamcenter class attribute names,
;  plus the mandatory columns:
;     item_id | object_type | CLASS_NAME | CLASS_ID
;  (the historic Delete delimiter is '|')
; -----------------------------------------------------------------------------
[DELETE]
INPUT_MODE    = CSV

CSV_FILE      = D:\ITK_customization\ClassificationUtilities\ClassificationDelete\ValidationInputBlade.txt
CSV_DELIMITER = |
CSV_HAS_HEADER = YES
CSV_DB_FALLBACK_TO_CSV = NO

DB_CONN_STR   = DSN=TCDB;UID=readonly;PWD=readonly
DB_QUERY      = SELECT item_id, item_revision_id, object_type, CLASS_ID, CLASS_NAME FROM pitem
CSV_DB_QUERY  = SELECT item_id, item_revision_id, object_type, CLASS_ID, CLASS_NAME FROM pitem WHERE item_id = '%ITEM_ID%'


; -----------------------------------------------------------------------------
;  RUN - which utility the master Run.bat executes.
;  Change this single line and double-click Run.bat:
;     EXTRACTION | IMPORT | DELETE
; -----------------------------------------------------------------------------
[RUN]
FUNCTION = EXTRACTION
